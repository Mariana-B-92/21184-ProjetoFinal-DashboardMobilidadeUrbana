# Configuracao do verificador de tipos (mypy).
#
# Varias bibliotecas de terceiros usadas no projeto (plotly, geopandas,
# dash, dash_leaflet, py7zr) nao distribuem informacao de tipos (type stubs
# / marcador py.typed). Sem esta opcao, o mypy emite um aviso "missing
# library stubs" em cada importacao dessas bibliotecas — ruido que nao
# corresponde a erros reais no codigo.
[mypy]
ignore_missing_imports = True
